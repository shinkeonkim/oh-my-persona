<!DOCTYPE html>
<html>
<head>
    <title>환경 변수 설정 필요</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .error {
            background-color: #ffebee;
            border: 1px solid #f44336;
            border-radius: 5px;
            padding: 20px;
            margin: 20px 0;
        }
        .code {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            font-family: monospace;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ 환경 변수 설정이 필요합니다</h1>

        <div class="error">
            <p>.env 파일에 다음 환경변수를 설정해주세요:</p>
            <div class="code">
KAKAO_CLIENT_ID=your-kakao-rest-api-key<br>
KAKAO_SECRET_KEY=your-kakao-secret-key
            </div>
        </div>

        <p><a href="/api/v1/users/kakao/test/">설정 완료 후 다시 시도</a></p>
    </div>
</body>
</html>
