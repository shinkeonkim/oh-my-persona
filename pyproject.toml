[project]
name = "oh-my-persona"
version = "0.1.0"
description = "Provenance-first persona knowledge base and RAG chatbot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.6",
  "fastapi>=0.115",
  "pydantic>=2.10",
  "psycopg[binary]>=3.2",
  "strands-agents[litellm]>=1.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
ingest = ["beautifulsoup4>=4.12", "httpx>=0.28", "pypdf>=5.0"]
vector = ["pgvector>=0.3", "psycopg[binary]>=3.2"]
dev = ["mypy>=1.17", "pytest>=8.3", "ruff>=0.9"]

[project.scripts]
persona = "oh_my_persona.cli:main"
persona-discord-worker = "oh_my_persona.discord_bridge:run_worker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oh_my_persona"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["data/raw", "data/processed"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = [
  "src/oh_my_persona/domain",
  "src/oh_my_persona/application",
  "src/oh_my_persona/presentation/schemas.py",
]
