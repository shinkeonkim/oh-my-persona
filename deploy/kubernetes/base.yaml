apiVersion: v1
kind: Namespace
metadata:
  name: persona
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persona
  namespace: persona
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: persona}
  template:
    metadata:
      labels: {app.kubernetes.io/name: persona}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: app
          image: ghcr.io/shinkeonkim/oh-my-persona:main
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{secretRef: {name: persona-secrets}}]
          env:
            - {name: PERSONA_MODEL_ALIASES, value: "persona-chat,persona-fast"}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata: {name: persona, namespace: persona}
spec:
  selector: {app.kubernetes.io/name: persona}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: persona, namespace: persona}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: persona}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: persona, namespace: persona}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: persona}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cloudflare-tunnel}}
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: litellm}}
      ports: [{protocol: TCP, port: 4000}]
    - to:
        - podSelector: {matchLabels: {cnpg.io/cluster: persona-db}}
      ports: [{protocol: TCP, port: 5432}]
