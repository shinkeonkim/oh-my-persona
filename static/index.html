<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="김신건의 공개 기록을 근거로 대화하는 페르소나 챗봇"><title>김신건과 대화하기</title><link rel="stylesheet" href="/static/app.css"></head><body>
<main class="chat-app"><header class="chat-header"><div class="avatar">김</div><div><h1>김신건</h1><p>공개 자료를 근거로 답변합니다</p></div><label class="model-picker"><span>모델</span><select id="model"></select></label></header>
<section id="messages" class="messages" aria-live="polite"><div class="day-divider"><span>오늘</span></div><article class="message-row assistant"><div class="avatar small">김</div><div><strong class="sender">김신건</strong><div class="bubble">안녕하세요. 제 경력과 프로젝트, 기술적 판단에 대해 편하게 질문해 주세요.</div></div></article></section>
<form id="chat-form" class="chat-form"><textarea id="message" maxlength="4000" required rows="1" aria-label="메시지" placeholder="메시지를 입력하세요"></textarea><button type="submit">전송</button></form></main>
<template id="message-template"><article class="message-row"><div class="avatar small">김</div><div class="message-body"><strong class="sender">김신건</strong><div class="bubble"></div><details class="citation-box"><summary>답변 근거</summary><ol class="sources"></ol></details></div></article></template><script src="/static/app.js" defer></script></body></html>
