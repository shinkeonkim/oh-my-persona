<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fa"><meta name="description" content="김신건의 공개 기록을 근거로 대화하는 페르소나 챗봇"><title>김신건과 대화하기</title><link rel="stylesheet" href="/static/app.css"></head><body>
<main class="messenger">
  <aside class="sidebar"><div class="brand"><span class="brand-mark">O</span><div><strong>Oh My Persona</strong><small>대화형 포트폴리오</small></div></div><button id="new-chat" class="new-chat"><span>＋</span> 새 대화 시작</button><div class="side-label">대화 상대</div><div class="contact active"><div class="avatar">김</div><div class="contact-copy"><strong>김신건</strong><span>백엔드 개발자 · 온라인</span></div><span class="unread">1</span></div><div class="side-label prompts-label">추천 질문</div><div class="side-prompts"><button data-question="백엔드 개발자로서 어떤 경험을 해오셨나요?">경력과 역할</button><button data-question="가장 깊게 고민한 프로젝트는 무엇인가요?">대표 프로젝트</button><button data-question="기술을 선택할 때 중요하게 보는 기준은 무엇인가요?">기술적 판단</button></div><footer><a href="/admin">관리 콘솔</a><span>출처가 있는 답변만 제공합니다</span></footer></aside>
  <section class="chat-panel">
    <header class="chat-header"><div class="mobile-back">‹</div><div class="avatar profile">김<span class="online-dot"></span></div><div class="profile-copy"><h1>김신건</h1><p><span></span> 온라인 · 보통 1분 이내 답변</p></div><label class="model-picker"><span>AI 모델</span><select id="model" aria-label="AI 모델"></select></label></header>
    <section id="messages" class="messages" aria-live="polite"><div class="day-divider"><span>오늘</span></div><article class="message-row assistant welcome"><div class="avatar small">김</div><div class="message-body"><strong class="sender">김신건</strong><div class="bubble">안녕하세요. 백엔드 개발자 김신건입니다.<br><br>제가 해온 일과 프로젝트, 기술을 선택한 이유가 궁금하시다면 편하게 물어봐 주세요. 공개된 자료를 바탕으로 직접 답변드리겠습니다.</div><div class="message-meta"><time>지금</time></div></div></article><div class="quick-prompts" aria-label="추천 질문"><button data-question="최근에 가장 집중하고 있는 일은 무엇인가요?">요즘 집중하는 일</button><button data-question="대표 프로젝트와 맡은 역할을 소개해 주세요.">대표 프로젝트</button><button data-question="어떤 개발자로 성장하고 싶으신가요?">성장 방향</button></div></section>
    <form id="chat-form" class="chat-form"><div class="composer"><button type="button" class="attach" aria-label="자료 안내">＋</button><textarea id="message" maxlength="4000" required rows="1" aria-label="메시지" placeholder="김신건에게 메시지 보내기"></textarea><button type="submit" class="send"><span>전송</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 17 8-17 8 3-8-3-8Zm3.8 7h7.7L6.6 6.8 7.8 11Zm-1.2 6.2 8.9-4.2H7.8l-1.2 4.2Z"/></svg></button></div><div class="composer-note">Enter로 전송 · Shift+Enter로 줄바꿈 · 답변에는 공개 출처가 표시됩니다</div></form>
  </section>
</main>
<template id="message-template"><article class="message-row"><div class="avatar small">김</div><div class="message-body"><strong class="sender">김신건</strong><div class="bubble"></div><div class="message-meta"><time>지금</time></div><details class="citation-box"><summary><span>⌁</span> 답변 근거 보기</summary><ol class="sources"></ol></details></div></article></template><script src="/static/app.js" defer></script></body></html>
